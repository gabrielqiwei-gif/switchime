name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent SwitchIME.app "SwitchIME-${GITHUB_REF_NAME}-universal.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: SwitchIME-*.zip
          generate_release_notes: true
